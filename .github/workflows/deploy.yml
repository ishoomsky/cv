name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── Основной сайт: https://shumski.dev (Hetzner, общий Caddy) ────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not ci) tolerates lockfiles generated by a different npm/OS.
      - run: npm install --no-audit --no-fund
      - run: npm run build -- --base-href=/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/cv/browser

  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload site and compose files
        run: |
          T="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh "$T" 'mkdir -p ~/cv-site/site'
          rsync -az --delete site/ "$T:~/cv-site/site/"
          rsync -az deploy/docker-compose.prod.yml deploy/nginx.conf "$T:~/cv-site/"
      - name: Start / refresh container
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd ~/cv-site && docker compose -f docker-compose.prod.yml up -d && docker compose -f docker-compose.prod.yml exec -T cv-web nginx -s reload'

  # ── GitHub Pages: только редирект на shumski.dev ─────────────────────────
  pages-redirect:
    needs: deploy-server   # старый адрес перенаправляем лишь после успешной выкладки
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: touch deploy/pages-redirect/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
