server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Файлы с хешем в имени (js/css Angular) кешируем навсегда.
  location ~* \.(?:js|css|woff2?)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # Картинки, текстуры, PDF: без хеша в имени — кешируем на неделю.
  location ~* \.(?:webp|png|jpg|svg|ico|pdf|jpeg)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  # SPA: любой другой путь (/portfolio, /contact) отдаёт index.html.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
